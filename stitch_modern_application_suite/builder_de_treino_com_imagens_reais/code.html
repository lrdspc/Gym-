<script>
        // Simple Interaction logic for tabs
        const tabs = document.querySelectorAll('[data-day-tab]');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('active-tab', 'text-on-surface');
                    t.classList.add('text-text-muted');
                    t.setAttribute('aria-pressed', 'false');
                });
                tab.classList.add('active-tab', 'text-on-surface');
                tab.classList.remove('text-text-muted');
                tab.setAttribute('aria-pressed', 'true');
            });
        });

        // Hover effect for cards
        const cards = document.querySelectorAll('.exercise-card');
        if (!prefersReducedMotion) {
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    card.classList.add('bg-surface-container');
                });
                card.addEventListener('mouseleave', () => {
                    card.classList.remove('bg-surface-container');
                });
            });
        }
    </script>
