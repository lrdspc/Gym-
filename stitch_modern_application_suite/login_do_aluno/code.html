<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .bg-noise {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 4px 4px;
        }
        .skip-link {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 20;
            transform: translateY(-200%);
            border-radius: 9999px;
            background: #c9f236;
            color: #000000;
            padding: 0.75rem 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease;
        }
        .skip-link:focus-visible {
            transform: translateY(0);
            outline: 2px solid #ffffef;
            outline-offset: 3px;
        }
        a,
        button,
        input,
        label {
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(201, 242, 54, 0.2);
        }
        body {
          min-height: max(884px, 100dvh);
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
            .animate-fade-in {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .skip-link {
                transition: none;
            }
        }
    </style>

<body class="bg-pure-black text-on-surface min-h-screen flex flex-col items-center justify-between p-container-margin font-body-md antialiased relative z-10 selection:bg-primary-fixed selection:text-pure-black">
<a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
<div class="fixed inset-0 pointer-events-none z-[-1] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-dim/40 via-pure-black to-pure-black"></div>
<div class="fixed inset-0 pointer-events-none z-[-1] bg-noise opacity-50"></div>
<header class="w-full max-w-md pt-8 flex justify-center md:justify-start">
<p class="font-headline-md text-headline-md text-primary-fixed tracking-widest opacity-90" translate="no">TRAINFLOW</p>
</header>
<main class="w-full max-w-md flex-1 flex flex-col justify-center animate-fade-in" id="conteudo-principal" tabindex="-1">
<div class="mb-10 text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-primary-fixed mb-2 drop-shadow-[0_0_15px_rgba(201,242,54,0.15)]" id="page-title">BEM-VINDO</h1>
<p class="font-body-md text-body-md text-text-muted">Enviaremos um link de acesso para o seu email.</p>
</div>
<form aria-labelledby="page-title" class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="relative group">
<label class="sr-only" for="email">Email</label>
<p class="sr-only" id="email-hint">Digite o email cadastrado para receber o link de acesso.</p>
<input aria-describedby="email-hint" autocomplete="email" autocapitalize="none" class="w-full h-button-height-standard bg-surface-dim border border-border-subtle rounded-xl px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-secondary-container focus:outline-none focus-visible:border-primary-fixed focus-visible:ring-1 focus-visible:ring-primary-fixed focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-fixed transition-[border-color,box-shadow] duration-300 shadow-sm group-hover:border-outline-variant" id="email" inputmode="email" name="email" placeholder="Seu email" required="" spellcheck="false" type="email"/>
</div>
<button class="w-full h-button-height-standard bg-primary-fixed text-pure-black font-headline-md text-headline-md rounded-full flex items-center justify-center gap-2 hover:bg-primary-container active:scale-95 transition-[background-color,box-shadow,transform] duration-200 mt-4 shadow-[0_4px_20px_rgba(201,242,54,0.2)] hover:shadow-[0_4px_25px_rgba(201,242,54,0.3)] focus:outline-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-fixed focus-visible:ring-2 focus-visible:ring-primary-fixed/40" type="submit">
                ENTRAR
                <span aria-hidden="true" class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
</main>
<footer class="w-full max-w-md pb-8 flex justify-center">
<nav aria-label="Opcoes de acesso">
<a aria-label="Entrar como personal trainer" class="font-label-md text-label-md text-text-muted hover:text-on-surface transition-[color,background-color] duration-200 inline-block py-2 px-4 rounded-full hover:bg-surface-dim focus:outline-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-fixed" href="#">
            Sou personal trainer
        </a>
</nav>
</footer>
</body></html>
