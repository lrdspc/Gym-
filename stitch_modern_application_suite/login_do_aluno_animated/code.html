<style>
@keyframes logoEntry {
    from {
        opacity: 0;
        transform: translateY(-40px);
        } to {
        opacity: 1;
        transform: translateY(0);
        }
    }
.animate-logo {
    animation: logoEntry 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards
    }
@keyframes sharpScaleUp {
    0% {
        opacity: 0;
        transform: scale(0.85);
        filter: blur(10px);
        } 70% {
        transform: scale(1.05);
        filter: blur(0);
        } 100% {
        opacity: 1;
        transform: scale(1);
        }
    }
.animate-heading {
    opacity: 0;
    animation: sharpScaleUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: 0.3s
    }
@keyframes slideInLeft {
    from {
        opacity: 0;
        transform: translateX(-30px);
        } to {
        opacity: 1;
        transform: translateX(0);
        }
    }
.animate-input {
    opacity: 0;
    animation: slideInLeft 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.5s
    }
@keyframes buttonEntry {
    from {
        opacity: 0;
        transform: scale(0.5);
        } to {
        opacity: 1;
        transform: scale(1);
        }
    }
@keyframes continuousGlow {
    0%, 100% {
        box-shadow: 0 0 15px rgba(201, 242, 54, 0.2);
        } 50% {
        box-shadow: 0 0 30px rgba(201, 242, 54, 0.5);
        }
    }
.animate-button-entrance {
    opacity: 0;
    animation: buttonEntry 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    animation-delay: 0.7s
    }
.animate-glow {
    animation: continuousGlow 3s ease-in-out infinite
    }
@keyframes floatSlow {
    0%, 100% {
        transform: translateY(0);
        } 50% {
        transform: translateY(-5px);
        }
    }
@keyframes fadeIn {
    from {
        opacity: 0;
        } to {
        opacity: 1;
        }
    }
.animate-footer {
    opacity: 0;
    animation: fadeIn 1s ease forwards, floatSlow 4s ease-in-out infinite;
    animation-delay: 1.2s
    }
@keyframes grainMove {
    0%, 100% {
        transform: translate(0, 0);
        } 10% {
        transform: translate(-1%, -1%);
        } 30% {
        transform: translate(1%, 1%);
        } 50% {
        transform: translate(-1%, 1%);
        } 70% {
        transform: translate(1%, -1%);
        } 90% {
        transform: translate(-0.5%, -0.5%);
        }
    }
.bg-grain {
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    opacity: 0.05;
    pointer-events: none;
    z-index: -1;
    object-fit: cover;
    animation: grainMove 8s steps(10) infinite
    }
.skip-link {
    position: absolute;
    top: 1rem;
    left: 1rem;
    z-index: 20;
    transform: translateY(-200%);
    border-radius: 9999px;
    background: #c9f236;
    color: #000000;
    padding: 0.75rem 1rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s ease;
    }
.skip-link:focus-visible {
    transform: translateY(0);
    outline: 2px solid #ffffff;
    outline-offset: 3px;
    }
a,
button,
input,
label {
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(201, 242, 54, 0.2);
    }
body {
    min-height: max(884px, 100dvh);
    overflow: hidden;
    }
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        }
    .animate-logo,
    .animate-heading,
    .animate-input,
    .animate-button-entrance,
    .animate-glow,
    .animate-footer,
    .bg-grain {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        }
    .skip-link {
        transition: none;
        }
    }</style>

<body class="bg-pure-black text-on-surface min-h-screen flex flex-col items-center justify-between p-container-margin font-body-md antialiased relative z-10 selection:bg-primary-fixed selection:text-pure-black">

<header class="w-full max-w-md pt-8 flex justify-center md:justify-start animate-logo">
<p class="font-headline-md text-headline-md text-primary-fixed tracking-widest" translate="no">TRAINFLOW</p>
</header>
<main class="w-full max-w-md flex-1 flex flex-col justify-center" id="conteudo-principal" tabindex="-1">
<div class="mb-10 text-center md:text-left animate-heading">
<h1 class="font-display-lg text-display-lg text-primary-fixed mb-2 drop-shadow-[0_0_15px_rgba(201,242,54,0.15)]" id="page-title">BEM-VINDO</h1>
<p class="font-body-md text-body-md text-text-muted">Enviaremos um link de acesso para o seu email.</p>
</div>
<form aria-labelledby="page-title" class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="relative group animate-input">
<label class="sr-only" for="email">Email</label>
<p class="sr-only" id="email-hint">Digite o email cadastrado para receber o link de acesso.</p>
<input aria-describedby="email-hint" autocomplete="email" autocapitalize="none" class="w-full h-button-height-standard bg-surface-container-high border border-border-subtle rounded-xl px-4 py-2 font-body-md text-body-md text-on-surface placeholder:text-on-secondary-container focus:outline-none focus-visible:border-primary-fixed focus-visible:ring-1 focus-visible:ring-primary-fixed focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-fixed transition-[border-color,box-shadow] duration-300 group-hover:border-outline-variant" id="email" inputmode="email" name="email" placeholder="Seu email" required="" spellcheck="false" type="email"/>
</div>
<div class="animate-button-entrance">
<button class="w-full h-button-height-standard bg-primary-fixed text-pure-black font-headline-md text-headline-md rounded-full flex items-center justify-center gap-2 hover:bg-primary-container active:scale-95 transition-[background-color,box-shadow,transform] duration-200 mt-4 animate-glow shadow-[0_4px_20px_rgba(201,242,54,0.15)] focus:outline-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-fixed focus-visible:ring-2 focus-visible:ring-primary-fixed/40" type="submit">
                    ENTRAR
                    <span aria-hidden="true" class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</form>
</main>
<footer class="w-full max-w-md pb-8 flex justify-center animate-footer">
<nav aria-label="Opcoes de acesso">
<a aria-label="Entrar como personal trainer" class="font-label-md text-label-md text-text-muted hover:text-primary-fixed transition-[color,background-color] duration-200 inline-block py-2 px-4 rounded-full hover:bg-surface-container-high focus:outline-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-fixed" href="#">
            Sou personal trainer
        </a>
</nav>
</footer>
</body></html>
