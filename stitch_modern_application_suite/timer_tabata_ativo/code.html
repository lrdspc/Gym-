<style>

            padding: 0.75rem 1rem;
            border-radius: 9999px;
            background-color: #c9f236;
            color: #000000;
            transform: translateY(-200%);
            transition: transform 0.2s ease;
        }
        .skip-link:focus-visible {
            transform: translateY(0);
            outline: 2px solid #e5e2e1;
            outline-offset: 2px;
        }
        .focus-ring:focus-visible {
            outline: 2px solid #c9f236;
            outline-offset: 3px;
        }
        .transition-interactive {
            transition-property: transform, opacity, color, background-color, border-color, box-shadow;
            transition-duration: 200ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        button,
        input,
        a {
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(201, 242, 54, 0.16);
        }
        .timer-ring {
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .blur-backdrop {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition-duration: 0.01ms !important;

            }

<!-- Interactive Script -->
<script>
        let timeLeft = 20;
        let totalTime = 20;
        let isWork = true;
        let isPaused = false;
        let round = 3;

        const countdownDisplay = document.getElementById('countdown-value');
        const progressRing = document.getElementById('progress-ring');
        const phaseLabel = document.getElementById('phase-label');
        const pauseBtn = document.getElementById('pause-btn');
        const glow = document.getElementById('ambient-glow');
        const roundDisplay = document.getElementById('current-round');

        const circumference = 2 * Math.PI * 46;

        function updateTimer() {
            if (isPaused) return;

            if (timeLeft > 0) {
                timeLeft--;
                countdownDisplay.textContent = timeLeft;
                
                // Update Progress Ring
                const offset = circumference - (timeLeft / totalTime) * circumference;
                progressRing.style.strokeDashoffset = offset;
            } else {
                togglePhase();
            }
        }

        function togglePhase() {
            isWork = !isWork;
            if (isWork) {
                timeLeft = 20;
                totalTime = 20;
                phaseLabel.textContent = 'WORK';
                phaseLabel.className = 'font-headline-lg text-headline-lg uppercase tracking-[0.2em] text-primary-fixed transition-colors duration-300';
                progressRing.className = 'timer-ring stroke-primary-fixed';
                glow.className = 'absolute inset-0 opacity-10 pointer-events-none transition-colors duration-1000 bg-primary-fixed-dim';
                round++;
                roundDisplay.textContent = round;
            } else {
                timeLeft = 10;
                totalTime = 10;
                phaseLabel.textContent = 'REST';
                phaseLabel.className = 'font-headline-lg text-headline-lg uppercase tracking-[0.2em] text-status-warning transition-colors duration-300';
                progressRing.className = 'timer-ring stroke-status-warning';
                glow.className = 'absolute inset-0 opacity-10 pointer-events-none transition-colors duration-1000 bg-status-warning';
            }
            countdownDisplay.textContent = timeLeft;
            progressRing.style.strokeDashoffset = 0;
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.setAttribute('aria-pressed', String(isPaused));
            pauseBtn.setAttribute('aria-label', isPaused ? 'Retomar timer' : 'Pausar timer');
            pauseBtn.innerHTML = isPaused ? 
                `<span aria-hidden="true" class="material-symbols-outlined">play_arrow</span> RETOMAR` : 
                `<span aria-hidden="true" class="material-symbols-outlined">pause</span> PAUSAR`;
            
            if (isPaused) {
                pauseBtn.classList.replace('bg-primary-fixed', 'bg-white');
            } else {
                pauseBtn.classList.replace('bg-white', 'bg-primary-fixed');
            }
        });

        // Initialize dasharray
        progressRing.style.strokeDasharray = circumference;

        // Start interval
        setInterval(updateTimer, 1000);

        // Micro-interaction: visual feedback on tap
        document.body.addEventListener('mousedown', () => {
             document.body.classList.add('brightness-110');
             setTimeout(() => document.body.classList.remove('brightness-110'), 100);
        });
    </script>
